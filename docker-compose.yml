services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: autoecoleconnect
      POSTGRES_USER: autoecoleconnect
      POSTGRES_PASSWORD: autoecoleconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoecoleconnect -d autoecoleconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672" # console de gestion (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: autoecoleconnect
      DB_USER: autoecoleconnect
      DB_PASSWORD: autoecoleconnect
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      # Valeurs de dev uniquement — secrets gérés par Sealed Secrets en prod
      JWT_SECRET: dev-secret-a-changer-en-production-0123456789
      ADMIN_EMAIL: admin@autoecoleconnect.local
      ADMIN_PASSWORD: changez-moi-en-production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # l'image JRE n'embarque ni curl ni wget : simple test TCP via bash
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  control-plane-db:
    image: postgres:16
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: controlplane
    ports:
      - "5433:5432"
    volumes:
      - control-plane-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane -d controlplane"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane-backend:
    build: ./control-plane/backend
    ports:
      - "8090:8080"
    environment:
      DB_HOST: control-plane-db
      DB_PORT: "5432"
      DB_NAME: controlplane
      DB_USER: controlplane
      DB_PASSWORD: controlplane
      PROVISIONING_DOMAINE: localhost
      INVITE_TOKEN: dev-invite-token
      # GITHUB_PAT / RESEND_API_KEY volontairement absents en dev local —
      # GitHubServiceImpl/ResendEmailServiceImpl simulent (log) au lieu d'appeler
      # les vraies API.
    depends_on:
      control-plane-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3000:80" # nginx sert le bundle statique + proxy /api → backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:
  control-plane-db-data:
