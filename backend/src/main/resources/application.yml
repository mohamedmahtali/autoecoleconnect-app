spring:
  application:
    name: autoeecoleconnect-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autoecoleconnect}
    username: ${DB_USER:autoecoleconnect}
    password: ${DB_PASSWORD:autoecoleconnect}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    parameters:
      # Nom et slug de l'auto-école par défaut créée par le backfill v1.1
      # (docs/18 §18.3 lot 1) : avant la refonte, le tenant EST l'école.
      tenantSlug: ${TENANT_SLUG:auto-ecole}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8080

app:
  security:
    # HS256 exige au moins 32 octets — à surcharger impérativement en production
    jwt-secret: ${JWT_SECRET:dev-secret-a-changer-en-production-0123456789}
    jwt-duree-minutes: ${JWT_DUREE_MINUTES:1440}
  bootstrap:
    # Compte directeur créé au premier démarrage si la table est vide
    admin-email: ${ADMIN_EMAIL:admin@autoecoleconnect.local}
    admin-password: ${ADMIN_PASSWORD:changez-moi-en-production}
  # Secret partagé control-plane ↔ tenants (docs/16-backlog.md §16.3 item 14) :
  # permet à GET /api/stats/resume de répondre au control-plane sans JWT
  # tenant (il n'en a pas). Vide en dev local → l'en-tête interne est refusé.
  internal-stats-api-key: ${INTERNAL_STATS_API_KEY:}
  quotas:
    # Plan et statut d'essai injectés par le chart Helm (portail-tenant).
    # Défauts permissifs (groupe = illimité) pour le dev local et les tests.
    plan: ${TENANT_PLAN:groupe}
    trial: ${TENANT_TRIAL:false}
    # Grille validée le 18/07/2026 (avec la tarification 59/99/149 € HT).
    # -1 = illimité. Ne compte que les ressources actives (soft delete exclu).
    essai:
      eleves: 15
      moniteurs: 2
      vehicules: 2
    plans:
      solo: { eleves: 80, moniteurs: 3, vehicules: 3 }
      pro: { eleves: 250, moniteurs: 10, vehicules: 10 }
      groupe: { eleves: -1, moniteurs: -1, vehicules: -1 }
      reseau: { eleves: -1, moniteurs: -1, vehicules: -1 }

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  # OpenAPI 3.0 (et pas 3.1) : le mapping `nullable: true` -> `T | null` par
  # openapi-typescript est prévisible en 3.0 (en 3.1 la nullabilité passe par
  # `type: [..., "null"]`, moins stable selon les versions). Backlog #29.
  api-docs:
    version: openapi_3_0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      tenant: ${TENANT_SLUG:inconnu}
      app: backend
