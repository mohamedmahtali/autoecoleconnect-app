server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content Security Policy : script-src 'self' sans unsafe-inline/eval —
    # sans BFF Next.js, le JWT vit en sessionStorage (src/lib/session.ts)
    # faute de cookie httpOnly ; cette CSP réduit fortement la surface XSS
    # en empêchant l'exécution d'un script injecté, même si l'injection
    # elle-même réussit.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy /api → backend Spring Boot. En K8s, la Gateway route déjà /api
    # directement vers le Service backend (le frontend n'est même pas
    # traversé) ; ce bloc sert au dev local (docker-compose) et en filet de
    # sécurité si le pod frontend est atteint directement. "backend:8080" est
    # le même nom court dans docker-compose (service) et dans chaque
    # namespace tenant K8s (Service) — pas de configuration à faire varier.
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fallback SPA : toute route inconnue de nginx (ex. /admin/clients au
    # rechargement) retombe sur index.html, React Router prend le relais.
    location / {
        try_files $uri /index.html;
    }
}
