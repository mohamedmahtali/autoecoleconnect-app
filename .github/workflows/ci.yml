name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend — tests Maven
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests et vérification
        run: mvn -B verify

  control-plane-backend:
    name: Control Plane — tests Maven
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests et vérification
        run: mvn -B verify

  frontend:
    name: Frontend — build Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installation des dépendances
        run: npm ci
      - name: Build de production
        run: npm run build

  # Backlog #29 — garantie anti-dérive : les types TS du frontend sont générés
  # depuis la spec OpenAPI du backend. On régénère spec + types et on échoue si
  # le committé ne correspond plus au backend (un DTO changé sans régénérer).
  openapi-types:
    name: OpenAPI — types TS à jour ?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Régénère la spec OpenAPI (dump par OpenApiDocsTest)
        working-directory: backend
        run: mvn -B test -Dtest=OpenApiDocsTest
      - name: Copie la spec vers le frontend
        run: cp backend/target/openapi.json frontend/openapi.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Régénère les types TS
        working-directory: frontend
        run: |
          npm ci
          npm run gen:types
      - name: Échoue si les types TS committés sont périmés
        # On ne compare QUE api.generated.ts : il est trié (--alphabetize) donc
        # déterministe, insensible à l'ordre des schémas dans la spec (qui peut
        # varier selon l'environnement). openapi.json n'est qu'un intermédiaire.
        run: |
          if ! git diff --quiet -- frontend/src/types/api.generated.ts; then
            echo "::error::types TS périmés vs backend. Lance : (backend) mvn test -Dtest=OpenApiDocsTest && cp target/openapi.json ../frontend/openapi.json ; (frontend) npm run gen:types — puis committe."
            git --no-pager diff -- frontend/src/types/api.generated.ts | head -80
            exit 1
          fi
          echo "Types TS à jour ✅"
